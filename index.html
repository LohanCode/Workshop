<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Breaking Glass</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <nav aria-label="Primary navigation">
                <a class="site-logo" href="index.html" aria-label="Accueil Breaking Glass">
                    <img src="images/logo_bk_glass.png" alt="Breaking Glass">
                    <span class="site-name">Breaking Glass</span>
                </a>
                <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="navMenu" aria-label="Open navigation menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul class="nav-menu" id="navMenu">
                    <li><a href="connexion.html">Connexion</a></li>
                    <li><a href="actualites.html">Actualités</a></li>
                    <li><a href="boutique.html">Boutique</a></li>
                    <li><a href="about.html">A propos</a></li>
                </ul>
            </nav>
        </header>

        <main>
            Bienvenue dans le site de Breaking Glass, une entreprise spécialisée dans la vente de verre cassée à des prix cassés !
        </main>

        <script>
            const menuBtn = document.getElementById('menuBtn');
            const navMenu = document.getElementById('navMenu');

            const closeMenu = () => {
                navMenu.classList.remove('active');
                menuBtn.setAttribute('aria-expanded', 'false');
                menuBtn.setAttribute('aria-label', 'Open navigation menu');
            };

            menuBtn.addEventListener('click', () => {
                const isOpen = navMenu.classList.toggle('active');
                menuBtn.setAttribute('aria-expanded', String(isOpen));
                menuBtn.setAttribute('aria-label', isOpen ? 'Close navigation menu' : 'Open navigation menu');
            });

            document.addEventListener('click', (event) => {
                if (!event.target.closest('nav')) {
                    closeMenu();
                }
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    closeMenu();
                    menuBtn.focus();
                }
            });
        </script>
    </body>
</html>
